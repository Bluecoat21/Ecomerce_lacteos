<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contacto | Quesos & Tradición Arequipeña </title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="header"></div>

  <main class="container">
    <h1 class="titulo-pagina">Contacto</h1>
    <div class="checkout">
      <form class="form-box" id="form-contacto">
        <div class="campo">
          <label for="nombre">Tu nombre</label>
          <input id="nombre" required>
        </div>
        <div class="campo">
          <label for="mensaje">¿En qué podemos ayudarte?</label>
          <textarea id="mensaje" rows="5" required></textarea>
        </div>
        <button class="btn btn-wa" type="submit">Enviar por WhatsApp</button>
      </form>

      <aside class="resumen">
        <h3>Atención</h3>
        <p>Lunes a sábado, de 8:00 a 18:00.</p>
        <p>Arequipa, Perú.</p>
        <p>Los pedidos se confirman por WhatsApp.</p>
      </aside>
    </div>
  </main>

  <div id="footer"></div>

  <script src="js/app.js"></script>
  <script>
    document.getElementById("form-contacto").addEventListener("submit", e => {
      e.preventDefault();
      const nombre = document.getElementById("nombre").value;
      const mensaje = document.getElementById("mensaje").value;
      const texto = `Hola, soy ${nombre}. ${mensaje}`;
      window.open(`https://wa.me/${WHATSAPP}?text=${encodeURIComponent(texto)}`, "_blank");
    });
  </script>
</body>
</html>
