<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Productos | Quesos & Tradición Arequipeña </title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="header"></div>

  <main class="container">
    <h1 class="titulo-pagina" id="titulo">Todos los productos</h1>

    <div class="toolbar">
      <button class="toolbar-btn" id="toggle-filtros" type="button">Ocultar filtros</button>
      <label>
        Ordenar por:
        <select id="orden">
          <option value="relevancia">Relevancia</option>
          <option value="menor">Menor precio</option>
          <option value="mayor">Mayor precio</option>
          <option value="descuento">Mayor descuento</option>
          <option value="nombre">Nombre (A-Z)</option>
        </select>
      </label>
    </div>

    <div class="catalogo" id="catalogo">
      <aside class="filtros" id="filtros"></aside>
      <div>
        <p class="conteo" id="conteo"></p>
        <div class="grid" id="grid"></div>
      </div>
    </div>
  </main>

  <div id="footer"></div>

  <script src="js/app.js"></script>
  <script src="js/productos.js"></script>
</body>
</html>
